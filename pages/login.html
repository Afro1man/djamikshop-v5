<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — DjamikShop</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#E8501A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DjamikShop">
  <link rel="apple-touch-icon" href="/assets/icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DjamikShop">
  <meta property="og:title" content="DjamikShop — La marketplace du Niger">
  <meta property="og:description" content="Achetez et vendez partout au Niger : Niamey, Zinder, Maradi, Tahoua, Agadez et plus.">
  <meta property="og:image" content="https://djamikshop-v5.vercel.app/assets/icons/og-image.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DjamikShop — La marketplace du Niger">
  <meta name="twitter:description" content="Achetez et vendez partout au Niger.">
  <meta name="twitter:image" content="https://djamikshop-v5.vercel.app/assets/icons/og-image.svg">
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      background: var(--surface);
    }
    .auth-side {
      flex: 0 0 420px;
      background: linear-gradient(160deg, #0F172A 0%, #1E293B 60%, #312E81 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 48px;
      color: white;
      position: relative;
      overflow: hidden;
    }
    .auth-side::before {
      content: '';
      position: absolute; width: 350px; height: 350px;
      border-radius: 50%; border: 1px solid rgba(255,255,255,.06);
      top: -80px; right: -80px;
    }
    .auth-side::after {
      content: '';
      position: absolute; width: 200px; height: 200px;
      border-radius: 50%; border: 1px solid rgba(255,255,255,.04);
      bottom: -40px; left: -40px;
    }
    .auth-side h2 { font-family: 'Outfit', sans-serif; font-size: 2.2rem; font-weight: 800; margin-bottom: var(--space-3); }
    .auth-side p { opacity: .6; font-size: 1rem; line-height: 1.6; }
    .auth-side .brand-mark { width: 48px; height: 48px; border-radius: var(--r-md); background: linear-gradient(135deg, #FF5722, #F59E0B); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; margin-bottom: var(--space-6); box-shadow: 0 4px 20px rgba(255,87,34,.3); }

    .auth-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px var(--page-px); }
    .auth-box { width: 100%; max-width: 400px; }
    .auth-box h1 { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 800; margin-bottom: var(--space-1); }
    .auth-box .subtitle { color: var(--ink-3); font-size: .9rem; margin-bottom: var(--space-6); }
    .auth-footer { text-align: center; margin-top: var(--space-6); font-size: .85rem; color: var(--ink-3); }
    .auth-footer a { color: var(--brand); font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }

    .pwd-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px; border-radius: var(--r-full);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--ink-3); border: none; background: none;
    }
    .pwd-toggle:hover { color: var(--brand); }

    @media (max-width: 768px) {
      .auth-side { display: none; }
      .auth-main { padding: var(--space-6) var(--page-px); }
    }
  </style>
</head>
<body>

<script>if(typeof window.supabase==='undefined')window.supabase=null;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror=""></script>
<script src="../assets/js/app.js"></script>

<div class="auth-page">
  <div class="auth-side">
    <div class="brand-mark">D</div>
    <h2>Bienvenue<br>sur DjamikShop</h2>
    <p>La marketplace du Niger. Achetez et vendez en toute simplicité avec les paiements Mobile Money.</p>
  </div>
  <div class="auth-main">
    <div class="auth-box">
      <h1>Se connecter</h1>
      <p class="subtitle">Entrez vos identifiants pour accéder à votre compte</p>
      <form id="login-form" class="flex flex-col gap-4">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-input" placeholder="vous@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="input-icon-wrap" style="position:relative">
            <input type="password" id="password" class="form-input" placeholder="Votre mot de passe" required>
            <button type="button" class="pwd-toggle" id="pwd-toggle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="flex items-center justify-between" style="margin-top:4px">
          <label class="form-check">
            <input type="checkbox" id="remember">
            <span class="form-check-label">Se souvenir de moi</span>
          </label>
          <a href="forgot-password.html" style="font-size:.85rem;color:var(--brand);font-weight:500">Mot de passe oublié ?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-top:var(--space-2)">
          Se connecter
        </button>
      </form>
      <div class="auth-footer">
        Pas encore de compte ? <a href="signup.html">Créer un compte</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
