<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique — DjamikShop</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#E8501A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DjamikShop">
  <link rel="apple-touch-icon" href="/assets/icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DjamikShop">
  <meta property="og:title" content="DjamikShop — La marketplace du Niger">
  <meta property="og:description" content="Achetez et vendez partout au Niger : Niamey, Zinder, Maradi, Tahoua, Agadez et plus.">
  <meta property="og:image" content="https://djamikshop-v5.vercel.app/assets/icons/og-image.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DjamikShop — La marketplace du Niger">
  <meta name="twitter:description" content="Achetez et vendez partout au Niger.">
  <meta name="twitter:image" content="https://djamikshop-v5.vercel.app/assets/icons/og-image.svg">
  <link rel="preconnect" href="https://iiswzieybgcqrywvopsf.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
<script>if(typeof window.supabase==='undefined')window.supabase=null;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror=""></script>
<script src="../assets/js/app.js"></script>
<div class="page-body">
  <div class="container">
    <h1 style="margin-bottom:var(--space-4)">
      <svg class="dj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      Rechercher
    </h1>

    <!-- Barre de recherche + filtres rapides -->
    <div class="shop-toolbar">
      <div class="shop-search-wrap">
        <svg class="shop-search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="search" id="shop-search-input" class="form-input" placeholder="iPhone, voiture, terrain…" autocomplete="off">
      </div>
      <div class="shop-filters-row">
        <select id="city-select" class="form-input shop-select"><option value="">Toutes villes</option></select>
        <select id="cond-select" class="form-input shop-select"><option value="">Tous états</option></select>
        <select id="sort-select" class="form-input shop-select">
          <option value="created_at">Plus récent</option>
          <option value="distance">Plus proche de moi</option>
          <option value="price_asc">Prix croissant</option>
          <option value="price_desc">Prix décroissant</option>
        </select>
      </div>
    </div>

    <!-- Catégories en chips -->
    <div id="cats-row" class="shop-cats"></div>

    <script>
      // Wire la search input shop-search-input vers window.filters.search
      window.onDjamikReady && window.onDjamikReady(function() {
        var s = document.getElementById('shop-search-input');
        if (!s) return;
        var params = new URLSearchParams(location.search);
        if (params.get('q')) s.value = params.get('q');
        var t;
        s.addEventListener('input', function() {
          clearTimeout(t);
          t = setTimeout(function() {
            window.filters.search = s.value;
            window.loadProducts && window.loadProducts();
          }, 250);
        });
      });
    </script>

    <!-- Titre dynamique -->
    <h2 id="section-title" class="shop-section-title">Toutes les annonces</h2>

    <!-- Grille de produits -->
    <div id="products-grid" class="products-grid"></div>

  </div>
</div>

<style>
  .shop-toolbar { display:flex; flex-direction:column; gap:10px; margin-bottom:var(--space-4); }
  .shop-search-wrap { position:relative; }
  .shop-search-ic { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--ink-3); pointer-events:none; }
  #shop-search-input { padding-left:42px; height:48px; font-size:.95rem; }
  .shop-filters-row { display:flex; gap:8px; }
  .shop-select { flex:1; min-width:0; height:42px; font-size:.85rem; }
  .shop-cats { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:var(--space-4); scrollbar-width:none; }
  .shop-cats::-webkit-scrollbar { display:none; }
  .shop-section-title { font-family:Outfit,sans-serif; font-size:1rem; font-weight:700; margin:var(--space-2) 0 var(--space-4); color:var(--ink-2); }
  .products-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:var(--space-4); }
  @media(max-width:600px) {
    .shop-filters-row { flex-wrap:wrap; }
    .shop-select { min-width:calc(50% - 4px); }
    .products-grid { grid-template-columns:repeat(2, 1fr); gap:var(--space-3); }
  }
</style>

<script src="../assets/js/features/products.js"></script>
</body>
</html>
