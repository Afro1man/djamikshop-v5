<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — DjamikShop</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#E8501A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DjamikShop">
  <link rel="apple-touch-icon" href="/assets/icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DjamikShop">
  <meta property="og:title" content="DjamikShop — La marketplace du Niger">
  <meta property="og:description" content="Achetez et vendez partout au Niger : Niamey, Zinder, Maradi, Tahoua, Agadez et plus.">
  <meta property="og:image" content="https://djamikshop-v5.vercel.app/assets/icons/og-image.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DjamikShop — La marketplace du Niger">
  <meta name="twitter:description" content="Achetez et vendez partout au Niger.">
  <meta name="twitter:image" content="https://djamikshop-v5.vercel.app/assets/icons/og-image.svg">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
<script>if(typeof window.supabase==='undefined')window.supabase=null;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror=""></script>
<script src="../assets/js/app.js"></script>
<div class="page-body">
  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">Accueil</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      <span>Notifications</span>
    </div>
    <div class="notif-toolbar">
      <h1><svg class="dj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> Notifications</h1>
      <button id="notif-mark-all" class="btn btn-outline btn-sm hidden">Tout marquer lu</button>
    </div>
    <div id="notifications-list"></div>
  </div>
</div>
<style>
  .notif-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:var(--space-6); }
  .notif-toolbar h1 { margin:0; }
  .notif-card { display:flex; gap:12px; align-items:flex-start; background:var(--white); border:1px solid var(--surface-3); border-radius:var(--r-lg); padding:14px; margin-bottom:10px; box-shadow:var(--shadow-sm); transition:background .15s; }
  .notif-card.unread { background:rgba(232,80,26,.04); border-color:rgba(232,80,26,.2); }
  .notif-card.unread::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--primary,#E8501A); flex-shrink:0; margin-top:8px; }
  .notif-icon { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .notif-icon.order { background:#dbeafe; color:#1e40af; }
  .notif-icon.offer { background:#dcfce7; color:#166534; }
  .notif-icon.default { background:var(--surface-2); color:var(--ink-3); }
  .notif-icon svg { width:18px; height:18px; }
  .notif-body { flex:1; min-width:0; }
  .notif-title { font-weight:600; font-size:.92rem; margin-bottom:3px; color:var(--ink); }
  .notif-text { font-size:.85rem; color:var(--ink-3); line-height:1.5; }
  .notif-time { font-size:.72rem; color:var(--ink-4); margin-top:6px; }
</style>
<script>
window.onDjamikReady(function() {
  var container = document.getElementById('notifications-list');
  var markAllBtn = document.getElementById('notif-mark-all');
  if (!container) return;
  _render();

  function _render() {
    var notifs = window.getNotifications ? window.getNotifications() : [];
    var hasUnread = notifs.some(function(n) { return !n.read; });
    if (markAllBtn) markAllBtn.classList.toggle('hidden', !hasUnread);

    if (!notifs.length) {
      container.innerHTML =
        '<div class="empty-state"><div class="empty-icon">' +
          '<svg class="dj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>' +
        '</div><h3>Aucune notification</h3><p>Vous serez prévenu ici des offres et commandes.</p></div>';
      return;
    }

    var icons = {
      order: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
      offer: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
      default: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>'
    };

    container.innerHTML = notifs.map(function(n) {
      var iconType = icons[n.type] ? n.type : 'default';
      return '<div class="notif-card ' + (n.read ? '' : 'unread') + '">' +
        '<div class="notif-icon ' + iconType + '">' + icons[iconType] + '</div>' +
        '<div class="notif-body">' +
          '<div class="notif-title">' + window.escHtml(n.title || '') + '</div>' +
          '<div class="notif-text">' + window.escHtml(n.body || '') + '</div>' +
          '<div class="notif-time">' + window.relativeDate(n.date) + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  if (markAllBtn) {
    markAllBtn.addEventListener('click', function() {
      window.markAllRead && window.markAllRead();
      _render();
    });
  }
});
</script>
</body>
</html>
