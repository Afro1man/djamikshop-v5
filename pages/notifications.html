<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — DjamikShop</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#E8501A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DjamikShop">
  <link rel="apple-touch-icon" href="/assets/icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DjamikShop">
  <meta property="og:title" content="DjamikShop — La marketplace du Niger">
  <meta property="og:description" content="Achetez et vendez partout au Niger : Niamey, Zinder, Maradi, Tahoua, Agadez et plus.">
  <meta property="og:image" content="https://djamikshop-v5.vercel.app/assets/icons/og-image.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DjamikShop — La marketplace du Niger">
  <meta name="twitter:description" content="Achetez et vendez partout au Niger.">
  <meta name="twitter:image" content="https://djamikshop-v5.vercel.app/assets/icons/og-image.svg">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body>
<script>if(typeof window.supabase==='undefined')window.supabase=null;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror=""></script>
<script src="../assets/js/app.js"></script>
<div class="page-body">
  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">Accueil</a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      <span>Notifications</span>
    </div>
    <div class="notif-toolbar">
      <h1><svg class="dj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> Notifications</h1>
      <button id="notif-mark-all" class="btn btn-outline btn-sm hidden">Tout marquer lu</button>
    </div>
    <div id="notifications-list"></div>
  </div>
</div>
<style>
  .notif-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:var(--space-6); }
  .notif-toolbar h1 { margin:0; }
  .notif-card { display:flex; gap:12px; align-items:flex-start; background:var(--white); border:1px solid var(--surface-3); border-radius:var(--r-lg); padding:14px; margin-bottom:10px; box-shadow:var(--shadow-sm); transition:background .15s; }
  .notif-card.unread { background:rgba(232,80,26,.04); border-color:rgba(232,80,26,.2); }
  .notif-card.unread::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--primary,#E8501A); flex-shrink:0; margin-top:8px; }
  .notif-icon { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .notif-icon.order { background:#dbeafe; color:#1e40af; }
  .notif-icon.offer { background:#dcfce7; color:#166534; }
  .notif-icon.default { background:var(--surface-2); color:var(--ink-3); }
  .notif-icon svg { width:18px; height:18px; }
  .notif-body { flex:1; min-width:0; }
  .notif-title { font-weight:600; font-size:.92rem; margin-bottom:3px; color:var(--ink); }
  .notif-text { font-size:.85rem; color:var(--ink-3); line-height:1.5; }
  .notif-time { font-size:.72rem; color:var(--ink-4); margin-top:6px; }
  .notif-del { flex-shrink:0; width:30px; height:30px; border-radius:50%; border:none; background:transparent; color:var(--ink-3); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s, color .15s; padding:0; align-self:center; }
  .notif-del:hover { background:#fef2f2; color:var(--danger,#ef4444); }
  .notif-del svg { width:16px; height:16px; }
</style>
<script>
window.onDjamikReady(async function() {
  var container = document.getElementById('notifications-list');
  var markAllBtn = document.getElementById('notif-mark-all');
  if (!container) return;

  var icons = {
    order:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
    offer:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    message: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    default: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>'
  };

  var notifs = [];
  var meId   = null;

  // ── Charge l'utilisateur + ses notifs depuis Supabase ──
  async function _load() {
    if (!window._supabase) return;
    try {
      var u = await window._supabase.auth.getUser();
      meId  = u && u.data && u.data.user && u.data.user.id;
      if (!meId) {
        container.innerHTML = '<div class="empty-state"><h3>Connexion requise</h3><p><a href="login.html?next=notifications.html" style="color:var(--primary)">Se connecter</a> pour voir vos notifications.</p></div>';
        return;
      }
      var r = await window._supabase.from('notifications')
        .select('*')
        .eq('user_id', meId)
        .order('created_at', { ascending: false })
        .limit(100);
      if (r && r.data) notifs = r.data.map(function(n){
        return {
          id: n.id, type: n.type, title: n.title, body: n.body,
          date: n.created_at, read: !!n.read_at, data: n.data
        };
      });
    } catch(e) { console.warn('[notif] load err', e); }
  }

  // ── Render ──
  function _render() {
    var hasUnread = notifs.some(function(n){ return !n.read; });
    if (markAllBtn) markAllBtn.classList.toggle('hidden', !hasUnread);

    if (!notifs.length) {
      container.innerHTML =
        '<div class="empty-state"><div class="empty-icon">' +
          icons.default +
        '</div><h3>Aucune notification</h3><p>Vous serez prévenu ici des offres, messages et commandes.</p></div>';
      return;
    }

    container.innerHTML = notifs.map(function(n) {
      var iconType = icons[n.type] ? n.type : 'default';
      var url = n.data && n.data.url ? n.data.url : null;
      var delBtn = '<button class="notif-del" data-del="' + n.id + '" aria-label="Supprimer" title="Supprimer">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14H7L5 6"/><path d="M10 11v6M14 11v6"/></svg>' +
        '</button>';
      var inner =
        '<div class="notif-icon ' + iconType + '">' + icons[iconType] + '</div>' +
        '<div class="notif-body">' +
          '<div class="notif-title">' + window.escHtml(n.title || '') + '</div>' +
          '<div class="notif-text">' + window.escHtml(n.body || '') + '</div>' +
          '<div class="notif-time">' + window.relativeDate(n.date) + '</div>' +
        '</div>' + delBtn;
      var cls = 'notif-card ' + (n.read ? '' : 'unread');
      return url
        ? '<a href="' + url + '" class="' + cls + '" data-id="' + n.id + '" style="text-decoration:none;color:inherit">' + inner + '</a>'
        : '<div class="' + cls + '" data-id="' + n.id + '">' + inner + '</div>';
    }).join('');

    // Marquer une notif comme lue au clic (sauf si on a cliqué sur supprimer)
    container.querySelectorAll('[data-id]').forEach(function(el) {
      el.addEventListener('click', async function(e) {
        if (e.target.closest('[data-del]')) return;
        var id = this.dataset.id;
        await _markRead([id]);
      });
    });

    // Bouton supprimer
    container.querySelectorAll('[data-del]').forEach(function(btn) {
      btn.addEventListener('click', async function(e) {
        e.preventDefault(); e.stopPropagation();
        var id = this.dataset.del;
        try {
          await window._supabase.from('notifications').delete().eq('id', id);
          notifs = notifs.filter(function(n){ return n.id !== id; });
          _render();
          if (window.toast) window.toast('Notification supprimée', 'success');
        } catch(err) {
          if (window.toast) window.toast('Échec de la suppression', 'error');
        }
      });
    });
  }

  async function _markRead(ids) {
    if (!window._supabase || !ids || !ids.length) return;
    try {
      await window._supabase.from('notifications')
        .update({ read_at: new Date().toISOString() })
        .in('id', ids);
      notifs.forEach(function(n){ if (ids.indexOf(n.id) !== -1) n.read = true; });
    } catch(e) {}
  }

  async function _markAll() {
    var ids = notifs.filter(function(n){ return !n.read; }).map(function(n){ return n.id; });
    await _markRead(ids);
    _render();
  }

  if (markAllBtn) markAllBtn.addEventListener('click', _markAll);

  // ── Realtime : refresh quand nouvelle notif ──
  function _subscribeRealtime() {
    if (!window._supabase || !meId) return;
    window._supabase.channel('notif:' + meId)
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'notifications',
        filter: 'user_id=eq.' + meId
      }, async function(payload) {
        var n = payload.new;
        notifs.unshift({
          id: n.id, type: n.type, title: n.title, body: n.body,
          date: n.created_at, read: !!n.read_at, data: n.data
        });
        _render();
      }).subscribe();
  }

  await _load();
  _render();
  _subscribeRealtime();
});
</script>
</body>
</html>
