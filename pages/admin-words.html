<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mots interdits — DjamikShop Admin</title>
  <meta name="theme-color" content="#E8501A">
  <meta name="robots" content="noindex,nofollow">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16.png">
  <link rel="apple-touch-icon" href="/assets/icons/icon-180.png">
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    .admin-h1 { font-family: Outfit,sans-serif; font-size: 1.4rem; margin: 0 0 4px; }
    .admin-sub { color: var(--ink-3); margin-bottom: var(--space-4); font-size: .9rem; }
    .add-form { display: flex; gap: 8px; margin-bottom: var(--space-4); flex-wrap: wrap; align-items: stretch; }
    .add-form input, .add-form select { padding: 10px 12px; border: 1px solid var(--surface-3); border-radius: var(--r-md); font-family: inherit; font-size: .9rem; }
    .add-form input { flex: 1; min-width: 180px; }
    .add-form button { padding: 10px 18px; }
    .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
    .word-card { display: flex; align-items: center; gap: 10px; background: var(--white); border: 1px solid var(--surface-3); border-radius: var(--r-md); padding: 10px 14px; box-shadow: var(--shadow-sm); }
    .word-text { flex: 1; min-width: 0; font-weight: 600; font-size: .92rem; word-break: break-all; }
    .word-cat { font-size: .68rem; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; flex-shrink: 0; }
    .word-cat.drug { background:#FEE2E2; color:#991B1B; }
    .word-cat.weapon { background:#0F1115; color:#fff; }
    .word-cat.sexual { background:#FCE7F3; color:#9D174D; }
    .word-cat.animal { background:#DCFCE7; color:#166534; }
    .word-cat.organ { background:#FEE2E2; color:#7F1D1D; }
    .word-del { width: 26px; height: 26px; border-radius: 50%; border: none; background: transparent; color: var(--ink-3); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; line-height: 1; padding: 0; }
    .word-del:hover { background: #fef2f2; color: var(--danger); }
    .access-denied { text-align: center; padding: 80px 20px; }
  </style>
</head>
<body>
<script>if(typeof window.supabase==='undefined')window.supabase=null;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror=""></script>
<script src="../assets/js/app.js"></script>

<div class="page-body">
  <div class="container">
    <div class="breadcrumb">
      <a href="admin.html">Admin</a>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      <span>Mots interdits</span>
    </div>
    <div id="admin-content"><div style="text-align:center;padding:40px;color:var(--ink-3)">Chargement…</div></div>
  </div>
</div>

<script>
window.onDjamikReady(async function() {
  var root = document.getElementById('admin-content');
  if (!root || !window._supabase) return;

  var u = await window._supabase.auth.getUser();
  var uid = u && u.data && u.data.user && u.data.user.id;
  if (!uid) { root.innerHTML = '<div class="access-denied"><h1>Connexion requise</h1></div>'; return; }
  var ad = await window._supabase.from('admins').select('user_id').eq('user_id', uid).maybeSingle();
  if (!ad || !ad.data) { root.innerHTML = '<div class="access-denied"><h1>Accès refusé</h1></div>'; return; }

  var sb = window._supabase;
  var words = (await sb.from('forbidden_words').select('*').order('category').order('word')).data || [];

  var CATEGORIES = ['drug','weapon','counterfeit','sexual','animal','organ','document','other'];

  function _render() {
    root.innerHTML =
      '<h1 class="admin-h1">Mots interdits (' + words.length + ')</h1>' +
      '<p class="admin-sub">Toute annonce contenant un de ces mots dans son titre ou sa description sera refusée par le serveur.</p>' +

      '<form class="add-form" id="add-form">' +
        '<input type="text" id="new-word" placeholder="Nouveau mot ou expression…" required maxlength="60">' +
        '<select id="new-cat">' +
          CATEGORIES.map(function(c){ return '<option value="' + c + '">' + c + '</option>'; }).join('') +
        '</select>' +
        '<button type="submit" class="btn btn-primary">Ajouter</button>' +
      '</form>' +

      '<div class="word-grid">' + words.map(function(w) {
        return '<div class="word-card">' +
          '<span class="word-text">' + window.escHtml(w.word) + '</span>' +
          '<span class="word-cat ' + w.category + '">' + w.category + '</span>' +
          '<button class="word-del" data-del="' + window.escHtml(w.word) + '" title="Supprimer">×</button>' +
        '</div>';
      }).join('') + '</div>';

    document.getElementById('add-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var word = document.getElementById('new-word').value.trim().toLowerCase();
      var cat  = document.getElementById('new-cat').value;
      if (!word) return;
      var ins = await sb.from('forbidden_words').insert([{ word: word, category: cat, severity: 'high' }]);
      if (ins.error) { window.toast('Échec : ' + ins.error.message, 'error'); return; }
      words.push({ word: word, category: cat, severity: 'high' });
      window.toast('Ajouté : ' + word, 'success');
      _render();
    });

    document.querySelectorAll('[data-del]').forEach(function(btn) {
      btn.addEventListener('click', async function() {
        var w = this.dataset.del;
        if (!confirm('Retirer le mot « ' + w + ' » de la liste ?')) return;
        var d = await sb.from('forbidden_words').delete().eq('word', w);
        if (d.error) { window.toast('Échec : ' + d.error.message, 'error'); return; }
        words = words.filter(function(x){ return x.word !== w; });
        window.toast('Supprimé', 'success');
        _render();
      });
    });
  }

  _render();
});
</script>
</body>
</html>
