<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscription — DjamikShop</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#E8501A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="apple-touch-icon" href="/assets/icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DjamikShop">
  <meta property="og:title" content="DjamikShop — La marketplace du Niger">
  <meta property="og:description" content="Achetez et vendez partout au Niger : Niamey, Zinder, Maradi, Tahoua, Agadez et plus.">

  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DjamikShop — La marketplace du Niger">
  <meta name="twitter:description" content="Achetez et vendez partout au Niger.">
  <meta name="twitter:image" content="https://djamikshop-v5.vercel.app/assets/icons/og-image.svg">
  <link rel="preconnect" href="https://iiswzieybgcqrywvopsf.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      background: var(--surface);
    }
    .auth-side {
      flex: 0 0 420px;
      background: linear-gradient(160deg, #0F172A 0%, #1E293B 60%, #312E81 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 48px;
      color: white;
      position: relative;
      overflow: hidden;
    }
    .auth-side h2 { font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 800; margin-bottom: var(--space-3); }
    .auth-side p { opacity: .6; font-size: .95rem; line-height: 1.6; }
    .auth-side .brand-mark { width: 48px; height: 48px; border-radius: var(--r-md); background: linear-gradient(135deg, #FF5722, #F59E0B); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; margin-bottom: var(--space-6); box-shadow: 0 4px 20px rgba(255,87,34,.3); }
    .auth-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px var(--page-px); }
    .auth-box { width: 100%; max-width: 440px; }
    .auth-box h1 { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 800; margin-bottom: var(--space-1); }
    .auth-box .subtitle { color: var(--ink-3); font-size: .9rem; margin-bottom: var(--space-5); }
    .auth-footer { text-align: center; margin-top: var(--space-5); font-size: .85rem; color: var(--ink-3); }
    .auth-footer a { color: var(--brand); font-weight: 600; }
    .pwd-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: var(--r-full); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-3); border: none; background: none; }
    .pwd-toggle:hover { color: var(--brand); }
    @media (max-width: 768px) { .auth-side { display: none; } .auth-main { padding: var(--space-6) var(--page-px); } }
  </style>
</head>
<body>
<script>if(typeof window.supabase==='undefined')window.supabase=null;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror=""></script>
<script src="../assets/js/app.js"></script>

<div class="auth-page">
  <div class="auth-side">
    <div class="brand-mark">D</div>
    <h2>Rejoignez<br>DjamikShop</h2>
    <p>Créez votre compte en quelques secondes et commencez à vendre ou acheter au Niger.</p>
  </div>
  <div class="auth-main">
    <div class="auth-box">
      <h1>Créer un compte</h1>
      <p class="subtitle">Remplissez le formulaire ci-dessous pour vous inscrire</p>
      <form id="signup-form" class="flex flex-col gap-3">
        <div class="form-group">
          <label class="form-label">Nom complet <span>*</span></label>
          <input type="text" id="full_name" class="form-input" placeholder="Amadou Issoufou">
        </div>
        <div class="form-group">
          <label class="form-label">Email <span>*</span></label>
          <input type="email" id="email" class="form-input" placeholder="vous@email.com">
        </div>
        <div class="form-group">
          <label class="form-label">Téléphone</label>
          <input type="tel" id="phone" class="form-input" placeholder="+227 XX XX XX XX">
        </div>
        <div class="form-group">
          <label class="form-label">Ville</label>
          <select id="location" class="form-select"><option value="">Choisir une ville</option></select>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe <span>*</span></label>
          <div class="input-icon-wrap" style="position:relative">
            <input type="password" id="password" class="form-input" placeholder="Min. 8 caractères">
            <button type="button" class="pwd-toggle" id="pwd-toggle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div id="pwd-strength"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirmer <span>*</span></label>
          <div class="input-icon-wrap" style="position:relative">
            <input type="password" id="confirm" class="form-input" placeholder="Répétez le mot de passe">
            <button type="button" class="pwd-toggle" id="conf-toggle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <label class="form-check mt-2">
          <input type="checkbox" id="terms">
          <span class="form-check-label">J'accepte les <a href="#" style="color:var(--brand)">conditions d'utilisation</a></span>
        </label>
        <button type="submit" class="btn btn-primary btn-lg btn-full mt-2"><svg class="dj-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></svg> Créer mon compte</button>
      </form>
      <div class="auth-footer">
        Déjà un compte ? <a href="login.html">Se connecter</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
