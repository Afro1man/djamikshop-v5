<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialisation — DjamikShop</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#E8501A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="DjamikShop">
  <link rel="apple-touch-icon" href="/assets/icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon.svg">
  <!-- Open Graph / Social -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DjamikShop">
  <meta property="og:title" content="DjamikShop — La marketplace du Niger">
  <meta property="og:description" content="Achetez et vendez partout au Niger : Niamey, Zinder, Maradi, Tahoua, Agadez et plus.">
  <meta property="og:image" content="https://djamikshop-v5.vercel.app/assets/icons/og-image.svg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DjamikShop — La marketplace du Niger">
  <meta name="twitter:description" content="Achetez et vendez partout au Niger.">
  <meta name="twitter:image" content="https://djamikshop-v5.vercel.app/assets/icons/og-image.svg">
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--surface); padding: var(--page-px); }
    .auth-box { width: 100%; max-width: 400px; background: var(--white); border: 1px solid var(--surface-3); border-radius: var(--r-xl); padding: var(--space-8); }
    .auth-box h1 { font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 800; margin-bottom: var(--space-2); }
    .auth-box .subtitle { color: var(--ink-3); font-size: .9rem; margin-bottom: var(--space-6); }
    .pwd-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: var(--r-full); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-3); border: none; background: none; }
    .pwd-toggle:hover { color: var(--brand); }
  </style>
</head>
<body>
<script>if(typeof window.supabase==='undefined')window.supabase=null;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror=""></script>
<script src="../assets/js/app.js"></script>
<div class="auth-page">
  <div class="auth-box">
    <h1>Nouveau mot de passe</h1>
    <p class="subtitle">Choisissez un mot de passe sécurisé.</p>
    <form id="reset-form" class="flex flex-col gap-3">
      <div class="form-group">
        <label class="form-label">Nouveau mot de passe</label>
        <div class="input-icon-wrap" style="position:relative">
          <input type="password" id="new-password" class="form-input" placeholder="Min. 8 caractères">
          <button type="button" class="pwd-toggle" id="npwd-toggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div id="npwd-strength"></div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirmer</label>
        <div class="input-icon-wrap" style="position:relative">
          <input type="password" id="new-confirm" class="form-input" placeholder="Répétez le mot de passe">
          <button type="button" class="pwd-toggle" id="ncnf-toggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg btn-full mt-2">Réinitialiser</button>
    </form>
  </div>
</div>
</body>
</html>
