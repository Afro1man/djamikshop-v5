<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DjamikShop — La marketplace du Niger 🇳🇪</title>
  <meta name="description" content="Achetez et vendez partout au Niger. Tout se vend ici.">
  <meta name="theme-color" content="#E8501A">
  <meta http-equiv="refresh" content="0; url=/pages/index.html">
  <link rel="canonical" href="/pages/index.html">
  <link rel="icon" type="image/png" href="/assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/icons/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">

  <!-- Preload pour reduire la latence apres redirect -->
  <link rel="preload" as="image" href="/assets/icons/icon-512.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      background: linear-gradient(135deg, #E8501A 0%, #C03E0E 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: white;
      overflow: hidden;
    }
    .splash {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: fadeIn .3s ease-out;
    }
    .splash-logo {
      width: 140px;
      height: 140px;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      animation: pop .5s cubic-bezier(.34, 1.56, .64, 1);
      background: white;
    }
    .splash-title {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      margin-top: 24px;
      letter-spacing: -0.02em;
    }
    .splash-title span { color: #F5B100; }
    .splash-subtitle {
      font-size: 0.9rem;
      opacity: 0.85;
      margin-top: 4px;
    }
    .splash-spinner {
      width: 32px; height: 32px;
      margin-top: 32px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #F5B100;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    a { color: #F5B100; }
    @keyframes pop {
      0%   { transform: scale(0.6); opacity: 0; }
      70%  { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <img class="splash-logo" src="/assets/icons/icon-512.png" alt="DjamikShop">
    <h1 class="splash-title">Djamik<span>Shop</span></h1>
    <p class="splash-subtitle">Tout se vend ici 🇳🇪</p>
    <div class="splash-spinner"></div>
    <noscript>
      <p style="margin-top:20px"><a href="/pages/index.html">Ouvrir DjamikShop →</a></p>
    </noscript>
  </div>
  <script>window.location.replace('/pages/index.html');</script>
</body>
</html>
