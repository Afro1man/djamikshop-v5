<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#E8501A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E8501A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand mark (D) -->
  <g transform="translate(100,180)">
    <rect width="160" height="160" rx="32" fill="#E8501A"/>
    <text x="80" y="80" text-anchor="middle" dominant-baseline="central"
          font-family="Outfit, system-ui, sans-serif" font-weight="800"
          font-size="110" fill="#fff">D</text>
  </g>

  <!-- Wordmark -->
  <text x="300" y="270" font-family="Outfit, system-ui, sans-serif" font-weight="800"
        font-size="92" fill="#fff">Djamik<tspan fill="#E8501A">Shop</tspan></text>

  <text x="300" y="330" font-family="Inter, system-ui, sans-serif"
        font-size="34" fill="#cbd5e1">La marketplace du Niger</text>

  <!-- Tagline -->
  <text x="100" y="490" font-family="Inter, system-ui, sans-serif" font-weight="600"
        font-size="40" fill="#fff">Achetez et vendez partout au Niger</text>
  <text x="100" y="540" font-family="Inter, system-ui, sans-serif"
        font-size="28" fill="#94a3b8">Niamey · Zinder · Maradi · Tahoua · Agadez · Dosso</text>
</svg>
