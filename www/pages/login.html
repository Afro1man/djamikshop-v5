<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="../assets/css/main.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      background: var(--surface);
    }
    .auth-side {
      flex: 0 0 420px;
      background: linear-gradient(160deg, #0F172A 0%, #1E293B 60%, #312E81 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 60px 48px;
      color: white;
      position: relative;
      overflow: hidden;
    }
    .auth-side::before {
      content: '';
      position: absolute; width: 350px; height: 350px;
      border-radius: 50%; border: 1px solid rgba(255,255,255,.06);
      top: -80px; right: -80px;
    }
    .auth-side::after {
      content: '';
      position: absolute; width: 200px; height: 200px;
      border-radius: 50%; border: 1px solid rgba(255,255,255,.04);
      bottom: -40px; left: -40px;
    }
    .auth-side h2 { font-family: 'Outfit', sans-serif; font-size: 2.2rem; font-weight: 800; margin-bottom: var(--space-3); }
    .auth-side p { opacity: .6; font-size: 1rem; line-height: 1.6; }
    .auth-side .brand-mark { width: 48px; height: 48px; border-radius: var(--r-md); background: linear-gradient(135deg, #FF5722, #F59E0B); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; font-weight: 800; margin-bottom: var(--space-6); box-shadow: 0 4px 20px rgba(255,87,34,.3); }

    .auth-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px var(--page-px); }
    .auth-box { width: 100%; max-width: 400px; }
    .auth-box h1 { font-family: 'Outfit', sans-serif; font-size: 1.6rem; font-weight: 800; margin-bottom: var(--space-1); }
    .auth-box .subtitle { color: var(--ink-3); font-size: .9rem; margin-bottom: var(--space-6); }
    .auth-footer { text-align: center; margin-top: var(--space-6); font-size: .85rem; color: var(--ink-3); }
    .auth-footer a { color: var(--brand); font-weight: 600; }
    .auth-footer a:hover { text-decoration: underline; }

    .pwd-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 32px; height: 32px; border-radius: var(--r-full);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--ink-3); border: none; background: none;
    }
    .pwd-toggle:hover { color: var(--brand); }

    /* ── OAuth Google ── */
    .auth-divider { display:flex; align-items:center; gap:12px; margin:22px 0 16px; color:var(--ink-3); font-size:.8rem; }
    .auth-divider::before, .auth-divider::after { content:''; flex:1; height:1px; background:var(--surface-3); }
    .btn-google {
      display:flex; align-items:center; justify-content:center; gap:12px;
      width:100%; padding:12px 16px; background:var(--white); color:var(--ink);
      border:1px solid var(--surface-3); border-radius:var(--r-md);
      font-family:inherit; font-size:.95rem; font-weight:600; cursor:pointer;
      transition:all .18s ease;
    }
    .btn-google:hover { background:#f8fafc; box-shadow:0 4px 12px rgba(0,0,0,.06); }
    .btn-google:active { transform:scale(.98); }
    .btn-google:disabled { opacity:.6; cursor:wait; }
    [data-theme="dark"] .btn-google { background:var(--surface); color:var(--ink); border-color:var(--surface-3); }
    [data-theme="dark"] .btn-google:hover { background:var(--surface-2); }

    @media (max-width: 768px) {
      .auth-side { display: none; }
      .auth-main { padding: var(--space-6) var(--page-px); }
    }
  </style>
</head>
<body>

<script>if(typeof window.supabase==='undefined')window.supabase=null;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror=""></script>
<script src="../assets/js/app.js"></script>

<div class="auth-page">
  <div class="auth-side">
    <div class="brand-mark">D</div>
    <h2>Bienvenue<br>sur DjamikShop</h2>
    <p>La marketplace du Niger. Achetez et vendez en toute simplicité avec les paiements Mobile Money.</p>
  </div>
  <div class="auth-main">
    <div class="auth-box">
      <h1>Se connecter</h1>
      <p class="subtitle">Entrez vos identifiants pour accéder à votre compte</p>
      <form id="login-form" class="flex flex-col gap-4">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-input" placeholder="vous@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="input-icon-wrap" style="position:relative">
            <input type="password" id="password" class="form-input" placeholder="Votre mot de passe" required>
            <button type="button" class="pwd-toggle" id="pwd-toggle">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="flex items-center justify-between" style="margin-top:4px">
          <label class="form-check">
            <input type="checkbox" id="remember">
            <span class="form-check-label">Se souvenir de moi</span>
          </label>
          <a href="forgot-password.html" style="font-size:.85rem;color:var(--brand);font-weight:500">Mot de passe oublié ?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg btn-full" style="margin-top:var(--space-2)">
          Se connecter
        </button>
      </form>

      <div class="auth-divider"><span>ou</span></div>

      <button type="button" id="btn-google-login" class="btn-google btn-full">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continuer avec Google
      </button>

      <div class="auth-footer">
        Pas encore de compte ? <a href="signup.html">Créer un compte</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
